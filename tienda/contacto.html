    <main>

        <section>

            <h1>Contáctanos</h1>

            <p>
                ¿Tienes alguna duda o necesitas ayuda?
                Completa el formulario y nos pondremos
                en contacto contigo.
            </p>

            <form>

                <label for="nombre">
                    Nombre:
                </label>

                <input
                    type="text"
                    id="nombre"
                    name="nombre"
                    required
                >

                <br><br>

                <label for="correo">
                    Correo electrónico:
                </label>

                <input
                    type="email"
                    id="correo"
                    name="correo"
                    required
                >

                <br><br>

                <label for="asunto">
                    Asunto:
                </label>

                <input
                    type="text"
                    id="asunto"
                    name="asunto"
                    required
                >

                <br><br>

                <label for="mensaje">
                    Mensaje:
                </label>

                <br>

                <textarea
                    id="mensaje"
                    name="mensaje"
                    rows="6"
                    cols="40"
                    required
                ></textarea>

                <br><br>

                <button type="submit">
                    Enviar mensaje
                </button>

            </form>

        </section>

    </main>
