<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administrativo | Level-Up Gamer</title>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/panel-admin.css">
</head>
<body>

    <div class="admin-layout">

        <!-- Menú vertical: navegación entre los mantenedores disponibles -->
        <aside class="admin-sidebar">
            <div>
                <div class="admin-sidebar__marca">
                    <img src="../img/img-index/logo1.png" alt="Logo Level-Up Gamer">
                </div>

                <nav class="admin-nav" aria-label="Navegación administrativa">
                    <ul>
                        <li><a href="index.html" class="activo">Inicio</a></li>
                        <li><a href="productos.html">Productos</a></li>
                        <li><a href="usuarios.html">Usuarios</a></li>
                    </ul>
                </nav>
            </div>

            <div class="admin-sidebar__pie">
                <nav class="admin-nav" aria-label="Cuenta">
                    <ul>
                        <li><a href="perfil.html">Perfil</a></li>
                        <li><a href="../login.html">Cerrar sesión</a></li>
                    </ul>
                </nav>
            </div>
        </aside>

        <!-- Contenido principal -->
        <main class="admin-contenido">
            <header class="admin-topbar">
                <h1>¡Hola, Administrador!</h1>
            </header>

            <section class="admin-paneles" aria-label="Resumen">
                <div class="admin-panel">
                    <h2 class="admin-panel__titulo">Resumen rápido</h2>
                    <div class="admin-resumen">
                        <div class="admin-resumen__item">
                            <span class="admin-resumen__valor">12</span>
                            <span class="admin-resumen__etiqueta">Productos</span>
                        </div>
                        <div class="admin-resumen__item">
                            <span class="admin-resumen__valor">8</span>
                            <span class="admin-resumen__etiqueta">Usuarios</span>
                        </div>
                        <div class="admin-resumen__item">
                            <span class="admin-resumen__valor">2</span>
                            <span class="admin-resumen__etiqueta">Stock crítico</span>
                        </div>
                    </div>
                </div>

                <div class="admin-panel">
                    <h2 class="admin-panel__titulo">Alertas de stock crítico</h2>
                    <ul class="admin-alertas__lista">
                        <li class="admin-alertas__item">
                            <span class="admin-alertas__nombre">PC Gamer ASUS ROG Strix <span>(CG001)</span></span>
                            <span class="admin-alertas__stock">Quedan 2 unidades</span>
                        </li>
                        <li class="admin-alertas__item">
                            <span class="admin-alertas__nombre">PlayStation 5 <span>(CO001)</span></span>
                            <span class="admin-alertas__stock">Quedan 3 unidades</span>
                        </li>
                    </ul>
                </div>
            </section>
        </main>

    </div>

</body>
</html>
